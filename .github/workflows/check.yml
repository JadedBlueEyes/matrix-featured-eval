name: Code quality
on:
  push:
  pull_request:

jobs:
  biome:
    name: runner / Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: mongolyy/reviewdog-action-biome@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}
          fail_level: warning
      - uses: EPMatt/reviewdog-action-tsc@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}
          fail_level: warning
      - name: Run node tests (spec + junit)
        id: node_test
        run: |
          mkdir -p coverage
          mkdir -p test-results
          set +e
          set -o pipefail
          pnpm run build
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter=junit --test-reporter=lcov --test-reporter-destination=stdout --test-reporter-destination=test-results/junit.xml --test-reporter-destination=coverage/lcov.info test/*.test.js 2>&1 | tee test-results/node-test.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/*.info
          if-no-files-found: ignore
      - name: Code Coverage Summary Report
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/*.info
          indicators: false
          format: markdown
          badge: true
      - name: Fail on node test failure
        if: steps.node_test.outputs.exit_code != '0'
        run: |
          echo "Node tests failed"
          exit 1