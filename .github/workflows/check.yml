name: Code quality
on:
  push:
  pull_request:

jobs:
  biome:
    name: runner / Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: mongolyy/reviewdog-action-biome@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}
          fail_level: warning
      - uses: EPMatt/reviewdog-action-tsc@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-check' || 'github-check' }}
          fail_level: warning
      - name: Run node tests (spec + junit)
        id: node_test
        run: |
          mkdir -p test-results
          set +e
          set -o pipefail
          pnpm run build
          pnpm exec c8 --reporter=lcov --report-dir=test-results node --test --enable-source-maps --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/junit.xml test/*.test.js 2>&1 | tee test-results/node-test.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: test-results/*.info
      - name: Upload test artifact
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          report_type: test_results
          files: test-results/*.xml
      - name: Fail on node test failure
        if: steps.node_test.outputs.exit_code != '0'
        run: |
          echo "Node tests failed"
          exit 1